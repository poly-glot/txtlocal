  <title id="messaging-title">Sending, delivery and replies</title>
  <desc id="messaging-desc">The api and the scheduler queue send jobs for send-worker, which sends through AWS End User Messaging; delivery events and replies return over SNS to delivery-events and inbound, which queue signed webhooks for the developer's endpoint.</desc>
