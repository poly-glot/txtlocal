<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="analytics-title analytics-desc">
  <title id="analytics-title">Counting clicks and usage from logs</title>
  <desc id="analytics-desc">Tracked links are served by redirect behind CloudFront and counted from CloudFront's access logs through Athena; send and API events are counted from CloudWatch Logs; the nightly rollup writes day rows to the table the screens read.</desc>
